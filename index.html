<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Lumina — minimal cosmic memory game." />
    <title>Lumina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css?v=cosmic-12" />
  </head>
  <body>
    <main id="app" class="app">
      <canvas id="garden"></canvas>

      <!-- Home Screen (Minimal Floating UI) -->
      <section id="home" class="overlay home" aria-label="Welcome screen">
        <!-- Top-left minimal Leaderboard Drawer Trigger -->
        <button id="leaderboardToggle" class="icon-pill leaderboard-toggle" type="button" aria-label="Leaderboard" title="Top Scores">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
          <span id="bestDisplay" class="best-pill-val">0</span>
        </button>

        <div class="home-content">
          <div class="hero-emblem" aria-hidden="true">
            <svg viewBox="0 0 96 96" width="76" height="76" fill="none">
              <circle class="orbit-ring orbit-ring--outer" cx="48" cy="48" r="42" stroke="rgba(126,221,181,0.22)" stroke-width="1" stroke-dasharray="3 6" />
              <g class="orbit-group orbit-group--cw">
                <ellipse cx="48" cy="48" rx="36" ry="14" transform="rotate(-28 48 48)" stroke="rgba(135,206,235,0.45)" stroke-width="1.3" />
                <circle cx="17" cy="31" r="2.8" fill="#7eddb5" />
              </g>
              <g class="orbit-group orbit-group--ccw">
                <ellipse cx="48" cy="48" rx="36" ry="14" transform="rotate(32 48 48)" stroke="rgba(184,169,232,0.45)" stroke-width="1.3" />
                <circle cx="77" cy="33" r="2.5" fill="#f5d76e" />
                <circle cx="58" cy="73" r="2.2" fill="#ff7b7b" />
              </g>
              <circle class="emblem-core-halo" cx="48" cy="48" r="18" fill="url(#luminaHalo)" />
              <circle class="emblem-core" cx="48" cy="48" r="9" fill="url(#luminaCore)" />
              <defs>
                <radialGradient id="luminaCore" cx="35%" cy="35%" r="65%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="55%" stop-color="#7eddb5" />
                  <stop offset="100%" stop-color="#06090f" stop-opacity="0" />
                </radialGradient>
                <radialGradient id="luminaHalo" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="rgba(126,221,181,0.45)" />
                  <stop offset="100%" stop-color="rgba(126,221,181,0)" />
                </radialGradient>
              </defs>
            </svg>
          </div>

          <h1 class="hero-title">LUMINA</h1>

          <div class="mode-grid" id="modeGrid">
            <button class="mode-card" data-mode="speed" type="button">
              <span class="mode-aura"></span>
              <span class="mode-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
              </span>
              <strong>Challenge</strong>
              <span class="mode-meta"><em class="mode-tag">15R</em> · <span id="best-speed">0</span></span>
            </button>

            <button class="mode-card" data-mode="endless" type="button">
              <span class="mode-aura"></span>
              <span class="mode-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 1 0 0-8c-2 0-4 1.33-6 4Z"/></svg>
              </span>
              <strong>Endless</strong>
              <span class="mode-meta"><em class="mode-tag">∞</em> · <span id="best-endless">0</span></span>
            </button>

            <button class="mode-card" data-mode="zen" type="button">
              <span class="mode-aura"></span>
              <span class="mode-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
              </span>
              <strong>Zen</strong>
              <span class="mode-meta"><em class="mode-tag">☽</em> · <span id="best-zen">0</span></span>
            </button>
          </div>

          <!-- Visual 3-Dot Hint (Watch -> Remember -> Tap) -->
          <div class="visual-hint" aria-hidden="true">
            <span class="vh-dot vh-dot--1"></span>
            <span class="vh-line"></span>
            <span class="vh-dot vh-dot--2"></span>
            <span class="vh-line"></span>
            <span class="vh-dot vh-dot--3"></span>
          </div>
        </div>

        <!-- Minimal Collapsible Leaderboard Popover -->
        <div id="leaderboardModal" class="leaderboard-modal hidden" role="dialog" aria-label="Leaderboard">
          <div class="leaderboard-card">
            <div class="leaderboard-head">
              <span>Top Constellations</span>
              <button id="leaderboardClose" class="icon-close" type="button" aria-label="Close">✕</button>
            </div>
            <div class="leaderboard-columns">
              <section>
                <h2>Challenge</h2>
                <ol id="homeLeaderboardSpeed" class="leaderboard-list"></ol>
              </section>
              <section>
                <h2>Endless</h2>
                <ol id="homeLeaderboardEndless" class="leaderboard-list"></ol>
              </section>
            </div>
          </div>
        </div>
      </section>

      <!-- Minimal HUD -->
      <header id="hud" class="hud hidden">
        <div class="hud-left">
          <button id="hudHomeBtn" class="hud-icon-btn" type="button" aria-label="Home" title="Home">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="hud-pill">
            <span class="hud-pill-prefix">R</span><strong id="roundVal">1</strong>
          </div>
          <div class="hud-pill hud-pill--score">
            <strong id="scoreVal">0</strong>
          </div>
        </div>

        <div class="hud-center">
          <span id="modeBadge" class="mode-badge sr-only">Challenge</span>
          <div id="phaseLabel" class="phase-label">WATCH</div>
          <p id="phaseMsg" class="phase-msg sr-only"></p>
          <div id="seqDots" class="seq-dots" aria-hidden="true"></div>
          <div id="timerBar" class="timer-bar hidden" aria-hidden="true">
            <div id="timerFill" class="timer-fill"></div>
          </div>
        </div>

        <div class="hud-right">
          <div id="comboPill" class="hud-pill hud-pill--combo">
            <strong id="comboVal">x0</strong>
          </div>
          <div id="shields" class="shields" aria-label="Shields"></div>
        </div>
      </header>

      <!-- Combo Meter -->
      <div id="comboMeter" class="combo-meter hidden">
        <div class="combo-fill" id="comboFill"></div>
      </div>

      <!-- Progress Bar -->
      <div id="progressBar" class="progress-bar hidden">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <!-- Floating feedback -->
      <div id="feedback" class="feedback hidden" aria-live="polite"></div>

      <!-- Power-up notification -->
      <div id="powerUpNotif" class="power-up-notif hidden"></div>

      <!-- Sound toggle -->
      <button id="soundToggle" class="sound-toggle" type="button" aria-label="Toggle sound">
        <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      </button>

      <!-- Minimal Result Screen -->
      <section id="result" class="overlay result hidden" role="dialog" aria-modal="true">
        <div class="result-card">
          <div class="result-orb-wrap">
            <span class="result-orb-ring"></span>
            <span class="result-icon sr-only" id="resultIcon"></span>
            <span class="result-rank" id="resultRank">S</span>
          </div>

          <div class="result-score-big" id="resultScoreBig">0</div>
          <h2 id="resultTitle" class="result-title-min">Synced</h2>
          <p id="resultText" class="result-sub-min"></p>

          <div class="result-stats">
            <div title="Accuracy">
              <span class="stat-icon">◎</span>
              <strong id="rAccuracy">100%</strong>
            </div>
            <div title="Best Combo">
              <span class="stat-icon">⚡</span>
              <strong id="rCombo">x0</strong>
            </div>
            <div title="Perfect Hits">
              <span class="stat-icon">✦</span>
              <strong id="rPerfect">0</strong>
            </div>
            <span id="rGood" class="sr-only">0</span>
          </div>

          <div class="leaderboard leaderboard--result sr-only" aria-hidden="true">
            <span id="resultLeaderboardTitle"></span>
            <ol id="resultLeaderboard"></ol>
          </div>

          <div class="result-actions">
            <button id="retryBtn" class="btn btn--primary" type="button" aria-label="Play Again">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              <span>Again</span>
            </button>
            <button id="homeBtn" class="btn btn--ghost" type="button" aria-label="Home">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="fx.js?v=cosmic-12"></script>
    <script src="game.js?v=cosmic-12"></script>
  </body>
</html>
